<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="162" height="392" viewBox="0 0 162 392">
  <title>Spider-Man hanging web — lower web swing</title>
  <desc>Spider-Man and upper web remain fixed. Only the lower web swings around the attachment point.</desc>

  <style>
    #lower-web-swing {
      transform-box: view-box;
      transform-origin: 57px 169px;
      animation: webSwing 2.8s ease-in-out infinite;
    }
    @keyframes webSwing {
      0%   { transform: rotate(-9deg); }
      50%  { transform: rotate(9deg); }
      100% { transform: rotate(-9deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      #lower-web-swing { animation: none; }
    }
    /* Disabled native animation to let Framer Motion control the swing with the Resume Card */
    #lower-web-swing { animation: none !important; }
  </style>

